; PlatformIO project for M5StickC Plus2 audio streaming client.

[env:m5stack-c]
platform = espressif32
board = m5stickc_plus2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

lib_deps =
    m5stack/M5StickCPlus2
    m5stack/M5Unified
    m5stack/M5GFX

build_flags =
    -DCORE_DEBUG_LEVEL=1
