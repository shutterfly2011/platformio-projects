; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stick-c]
platform = espressif32
; No dedicated PlatformIO board entry for the Plus2 exists in this platform
; version; m5stick-c's board def (same ESP32 core, close-enough flash size)
; works fine because M5Unified detects the actual hardware at runtime via
; M5.begin()/M5.config() rather than relying on the PlatformIO board file.
board = m5stick-c
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified
build_src_filter = +<*> -<data_collector_main.cpp> -<EdgeImpulseUploader.cpp>
; Flip this on (and add the exported Edge Impulse library to lib_deps) to
; run the trained ML model alongside the heuristic detector in parallel via
; EnsembleAngerDetector — see include/EdgeImpulseAngerDetector.h.
; build_flags = -DUSE_EDGE_IMPULSE

; Standalone data-collection firmware — connects to WiFi and uploads
; button-triggered labeled recordings to Edge Impulse for training data.
; See src/data_collector_main.cpp and copy include/Secrets.h.example to
; include/Secrets.h (gitignored) with your WiFi + Edge Impulse API key
; before building this env. Flash this, collect clips, then flash
; "m5stick-c" back for normal anger-monitoring use.
[env:datacollector]
extends = env:m5stick-c
build_src_filter = +<*> -<main.cpp>
; This board (M5StickC Plus2, ESP32-PICO-V3-02) has embedded PSRAM, but the
; generic m5stick-c board def (see comment above) doesn't enable it, and the
; recording buffer (up to 160 KB, see kDataCollectMaxSamples in Config.h)
; doesn't reliably fit in the ~100-150 KB of *contiguous* internal heap
; that's actually free after M5.begin() — confirmed on hardware, internal
; alloc failed with 280 KB free but only ~110 KB in the largest block.
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
