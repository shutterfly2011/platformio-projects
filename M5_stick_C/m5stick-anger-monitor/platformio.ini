; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stick-c]
platform = espressif32
; No dedicated PlatformIO board entry for the Plus2 exists in this platform
; version; m5stick-c's board def (same ESP32 core, close-enough flash size)
; works fine because M5Unified detects the actual hardware at runtime via
; M5.begin()/M5.config() rather than relying on the PlatformIO board file.
board = m5stick-c
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified
; Flip this on (and add the exported Edge Impulse library to lib_deps)
; once you upgrade from the heuristic detector — see
; include/EdgeImpulseAngerDetector.h.
; build_flags = -DUSE_EDGE_IMPULSE
